# GoNinja container checks. Generated by goninja.sh (only for repos with a Dockerfile).
name: GoNinja Container

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: goninja-container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  container:
    name: goninja-container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ vars.GONINJA_ENFORCE != 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
      - name: Misconfig scan (Dockerfile, manifests, IaC)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image CVE scan (fixable High/Critical)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: app:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
