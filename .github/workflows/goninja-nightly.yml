# GoNinja nightly: deep checks that never block developers.
name: GoNinja Nightly

on:
  schedule:
    - cron: "30 20 * * *"      # 02:00 IST
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GITLEAKS_VERSION: "8.21.2"

jobs:
  full-history-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --verbose --config .gitleaks.toml .

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit && pip-audit -r requirements.txt --desc

  running-image:
    if: vars.ECR_REPOSITORY != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:main
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  zap-full-scan:
    if: vars.STAGING_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: |
          chmod a+w .zap
          docker run --rm -v "$PWD/.zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:2.15.0 \
            zap-full-scan.py -t "${{ vars.STAGING_URL }}" -c rules.tsv -r zap-full.html -I
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-full-report
          path: .zap/zap-full.html
