# GoNinja CI. Generated by goninja.sh. Mode is controlled by the repo variable GONINJA_ENFORCE:
#   unset/false -> report-only (jobs never fail the PR)    true -> blocking
name: GoNinja CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: goninja-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  GITLEAKS_VERSION: "8.21.2"

jobs:
  hooks:
    name: goninja-hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ vars.GONINJA_ENFORCE != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch,gitleaks

  secrets:
    name: goninja-secrets
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: ${{ vars.GONINJA_ENFORCE != 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
      - name: Scan every commit in the PR
        run: ./gitleaks git --redact --verbose --config .gitleaks.toml --log-opts="origin/${{ github.base_ref }}..HEAD" .

  sast:
    name: goninja-sast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ vars.GONINJA_ENFORCE != 'true' }}
    container: semgrep/semgrep:1.99.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Semgrep (new findings only on PRs)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASELINE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASELINE="--baseline-commit $(git merge-base origin/${{ github.base_ref }} HEAD)"
          fi
          semgrep scan --config p/python --error --metrics=off $BASELINE

  sca:
    name: goninja-sca
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: ${{ vars.GONINJA_ENFORCE != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt --desc

  quality:
    name: goninja-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ vars.GONINJA_ENFORCE != 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Ruff report for SonarQube
        run: ruff check . --output-format=json --exit-zero > ruff-report.json
      - name: Tests with coverage (exit 5 = no tests collected, tolerated)
        run: pytest --cov=. --cov-report=xml:coverage.xml --junitxml=test-results.xml || [ $? -eq 5 ]
      - name: SonarQube scan + quality gate
        # Community Build has no PR analysis: PR scans only when SONAR_PR_ANALYSIS=true (Developer Edition+)
        if: github.event_name == 'push' || vars.SONAR_PR_ANALYSIS == 'true'
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
